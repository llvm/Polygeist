# One .test per HLSFactory_v2 design; see generate.py and SUMMARY.md.
import os

config.suffixes = [".test"]

# The RUN lines are the hls-est harness's cgeist command for the default shim
# (tools/hls-est-validate/run_hlsest.py in the CIRCT tree), written with these
# substitutions so that its flags are spelled out in one place.
_hls_dir = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))

# The extra cgeist flags of the Vitis stand-in headers (%vitis_include): the
# shim's own cgeist_flags file, which the harness reads too ('#' starts a
# comment).
_shim_flags = []
with open(os.path.join(_hls_dir, "Inputs", "vitis", "cgeist_flags")) as _f:
    for _line in _f:
        _shim_flags += _line.split("#", 1)[0].split()
config.substitutions.append(("%vitis_shim_flags", " ".join(_shim_flags)))

# The real Vitis HLS headers (the harness's default shim "real" since
# W11-adopt, CIRCT MEMOS #67; the tests generate.py writes by default): the
# flags of the harness's shim/real/cgeist_flags, copied to real_cgeist_flags by
# generate.py. They name the harness's Vitis install; $VITIS_AUTOPILOT points
# them at another one. The headers are not redistributable, so a test that
# reads them REQUIRES vitis-autopilot (the install is there) and xlx-bitwidth
# (cgeist's clang has -fxlx-bitwidth), detected as in ../realheaders.
import subprocess
import tempfile

_harness_autopilot = "/mnt/a/Vitis/2025.1/Vitis/common/technology/autopilot"
_autopilot = os.environ.get("VITIS_AUTOPILOT", _harness_autopilot)
_real_flags = []
with open(os.path.join(os.path.dirname(os.path.abspath(__file__)), "real_cgeist_flags")) as _f:
    for _line in _f:
        _real_flags += [t.replace(_harness_autopilot, _autopilot)
                        for t in _line.split("#", 1)[0].split()]
config.substitutions.append(("%vitis_real_flags", " ".join(_real_flags)))
if all(os.path.isfile(os.path.join(_autopilot, f)) for f in
       ("ap_int.h", "ap_fixed.h", "hls_math.h", os.path.join("etc", "autopilot_ssdm_op.h"))):
    config.available_features.add("vitis-autopilot")
_probe_failure = None
try:
    with tempfile.TemporaryDirectory() as _d:
        _src = os.path.join(_d, "probe.c")
        with open(_src, "w") as _f:
            _f.write("typedef int __attribute__((bitwidth(7))) i7; i7 f(i7 a) { return a; }\n")
        _probe = subprocess.run(
            [os.path.join(config.polygeist_tools_dir, "cgeist"), _src, "-Xclang", "-fxlx-bitwidth",
             "--function=*", "-S", "-o", "-"],
            capture_output=True, text=True, timeout=120)
    if "i7" in _probe.stdout:
        config.available_features.add("xlx-bitwidth")
    else:
        _probe_failure = "exit %s: %s" % (_probe.returncode, (_probe.stderr.strip().splitlines() or ["no output"])[-1][:200])
except Exception as _e:
    _probe_failure = "%s: %s" % (type(_e).__name__, _e)
# Every compiling test REQUIRES both features, so a failed probe would turn the
# whole suite UNSUPPORTED while lit still reports success. With the Vitis
# install present that is an error (lit exits nonzero after discovery), unless
# HLSFACTORY_ALLOW_NO_XLX_BITWIDTH=1 says the cgeist is knowingly one without
# -fxlx-bitwidth; then it is a warning (W11-adopt review D6).
if _probe_failure is not None and "vitis-autopilot" in config.available_features:
    _msg = ("hlsfactory: the cgeist -fxlx-bitwidth probe failed (%s); every compiling "
            "HLSFactory test would be UNSUPPORTED" % _probe_failure)
    if os.environ.get("HLSFACTORY_ALLOW_NO_XLX_BITWIDTH") == "1":
        lit_config.warning(_msg)
    else:
        lit_config.error(_msg + "; set HLSFACTORY_ALLOW_NO_XLX_BITWIDTH=1 to run without them")

# What Vitis 2025.1's front end adds to the design's own flags: the synthesis
# macros, and the language standard (C++ compiles as gnu++14, C as gnu99; a
# design that mixes the two languages gets no -std=). No name is a prefix of
# another, since lit replaces substitutions in list order.
_macros = "-D__SYNTHESIS__ -D__VITIS_HLS__ -D__HLS_SYN__ -DAESL_SYN"
config.substitutions.append(("%vitis_frontend_cpp", _macros + " -std=gnu++14"))
config.substitutions.append(("%vitis_frontend_c99", _macros + " -std=gnu99"))
config.substitutions.append(("%vitis_frontend_mixed", _macros))

# Where cgeist writes the MLIR the MLIR- lines check. The RUN line keeps
# "-o /dev/null" (the shape the harness's test parser, designs.py, expects);
# this second -o comes after it and wins. lit applies the per-test %t after
# these substitutions, so it is expanded here too.
config.substitutions.append(("%hlsfactory_mlir", "-o %t.mlir"))
