# HLS pragma tests. See docs/hls-pragmas.md.
import os
import pwd
import shutil

# Inputs/ holds headers and sources used by tests, not tests themselves.
config.excludes = set(config.excludes) | {"Inputs"}

hls_dir = os.path.dirname(os.path.abspath(__file__))
config.substitutions.append(("%hls_inputs", os.path.join(hls_dir, "Inputs")))
# Stand-ins for the Vitis HLS headers (ap_int.h, hls_stream.h, ...): a copy of
# the hls-est harness's bit-exact "exactclass" shim (Inputs/vitis/README.md).
# Its ap_* classes need --scalar-wrapper-abi, which every RUN line that uses
# %vitis_include passes.
config.substitutions.append(
    ("%vitis_include", "-I " + os.path.join(hls_dir, "Inputs", "vitis")))

# Consumer tests pipe cgeist output through hls-est (from the CIRCT tree).
# Point HLS_EST at the binary, or put it on PATH. Without it those tests are
# reported as UNSUPPORTED rather than failing.
hls_est = os.environ.get("HLS_EST") or shutil.which("hls-est")
if not hls_est:
    # The account's home directory, not $HOME: a run with HOME pointed at a
    # private work root (the harness does so) must find the same binary
    # (CIRCT W9 round 23 review D13: 4 tests became UNSUPPORTED).
    homes = []
    try:
        homes.append(pwd.getpwuid(os.getuid()).pw_dir)
    except KeyError:
        pass
    homes.append(os.path.expanduser("~"))
    for home in homes:
        for rel in ("circt/build/clion/bin/hls-est", "circt/build/bin/hls-est",
                    "circt/bin/hls-est"):
            candidate = os.path.join(home, rel)
            if os.path.isfile(candidate) and os.access(candidate, os.X_OK):
                hls_est = candidate
                break
        if hls_est:
            break
if hls_est:
    config.available_features.add("hls-est")
    config.substitutions.append(("%hls-est", hls_est))
