# The real Vitis HLS headers through cgeist (track W11). The headers are not
# redistributable, so the tests read them from a Vitis install: the synthesis
# tree <Vitis>/common/technology/autopilot, from $VITIS_AUTOPILOT or the 2025.1
# install the hls-est harness uses. Without it the tests are UNSUPPORTED
# (feature `vitis-autopilot`). They also need a clang with -fxlx-bitwidth
# (feature `xlx-bitwidth`, detected as in ../xlx/lit.local.cfg).
#
# %xlx_real is the Vitis front end's view of a source (db/autopilot.flow.log:331
# of every cached Vitis run: -I <autopilot>, the synthesis macros,
# -include etc/autopilot_ssdm_op.h, C++14) plus cgeist's Xilinx extensions;
# the same flags as the harness's shim/real/cgeist_flags.
import os
import subprocess
import tempfile

autopilot = os.environ.get(
    "VITIS_AUTOPILOT", "/mnt/a/Vitis/2025.1/Vitis/common/technology/autopilot")
needed = ["ap_int.h", "ap_fixed.h", "hls_math.h",
          os.path.join("etc", "autopilot_ssdm_op.h")]
if all(os.path.isfile(os.path.join(autopilot, f)) for f in needed):
    config.available_features.add("vitis-autopilot")

cgeist = os.path.join(config.polygeist_tools_dir, "cgeist")
probe = "typedef int __attribute__((bitwidth(7))) i7; i7 f(i7 a) { return a; }\n"
try:
    with tempfile.TemporaryDirectory() as d:
        src = os.path.join(d, "probe.c")
        with open(src, "w") as f:
            f.write(probe)
        out = subprocess.run(
            [cgeist, src, "-Xclang", "-fxlx-bitwidth", "--function=*", "-S",
             "-o", "-"],
            capture_output=True, text=True, timeout=120).stdout
    if "i7" in out:
        config.available_features.add("xlx-bitwidth")
except Exception:
    pass

real = [
    "--xlx-prelude",
    "-I", autopilot,
    "-D__SYNTHESIS__", "-D__VITIS_HLS__", "-DAESL_SYN", "-D__HLS_SYN__",
    "-D__DSP48E1__",
    "-include", os.path.join(autopilot, "etc", "autopilot_ssdm_op.h"),
    "-std=gnu++14",
    "-Xclang", "-fxlx-bitwidth",
    "-Xclang", "-fxlx-apint-promote",
    "-Xclang", "-fnative-half-type",
    "-Xclang", "-fnative-half-arguments-and-returns",
    "-Xclang", "-Wno-unknown-attributes",
    "-Xclang", "-fno-threadsafe-statics",
    "-Xclang", "-fno-use-cxa-atexit",
    "--scalar-wrapper-abi",
    "--xlx-headers",
]
config.substitutions.append(("%xlx_real", " ".join(real)))
config.substitutions.append(("%vitis_autopilot", autopilot))
