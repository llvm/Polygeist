# Xilinx HLS front-end extensions of cgeist (track W11): the bit builtins
# (--xlx-prelude, lowered by Lib/CGXlxBuiltin.cc), and the bitwidth(N)
# attribute, which needs a clang with -fxlx-bitwidth (Polygeist's
# llvm-project patched with patches/llvm-project/0001-xlx-bitwidth.patch).
# Tests that need the patched clang REQUIRE the feature `xlx-bitwidth`,
# detected here by compiling a one-line kernel.
import os
import subprocess
import tempfile

cgeist = os.path.join(config.polygeist_tools_dir, "cgeist")
probe = "typedef int __attribute__((bitwidth(7))) i7; i7 f(i7 a) { return a; }\n"
try:
    with tempfile.TemporaryDirectory() as d:
        src = os.path.join(d, "probe.c")
        with open(src, "w") as f:
            f.write(probe)
        out = subprocess.run(
            [cgeist, src, "-Xclang", "-fxlx-bitwidth", "--function=*", "-S",
             "-o", "-"],
            capture_output=True, text=True, timeout=120).stdout
    if "i7" in out:
        config.available_features.add("xlx-bitwidth")
except Exception:
    pass
